# Box Office Jedi — Automated Data Pipeline
# ============================================
# Split by day-of-week because reporting timing differs between weekday
# and weekend grosses, and Sunday needs its own range-scrape (see below).
#
#   DAILY CHART — weekdays: Mon-Fri at 4:00 PM ET (20:00 UTC)
#                Saturday : 3:30 PM ET (19:30 UTC) — scrapes yesterday (Friday) only.
#                Sunday   : 5:30 PM ET (21:30 UTC) — scrapes a Saturday-through-Sunday
#                           RANGE in one run, not just "yesterday".
#     Scrapes yesterday's daily box office numbers by default. The Numbers posts
#     weekday data later than weekend data — running too early on weekdays
#     used to fetch empty / partial tables (Disney late-reporting, etc.).
#     Sunday is the exception: the industry (and The Numbers) posts a
#     same-day ESTIMATE for Sunday alongside Saturday's confirmed actual,
#     both in the afternoon. Waiting for the normal "yesterday" scrape
#     meant Sunday's number didn't show up until Monday's run — a full day
#     late compared to every other box office site. The Sunday run is
#     pushed to 5:30 PM ET (vs. Saturday's 3:30 PM) to give The Numbers
#     extra time to post that same-day estimate. The per-day archive file
#     is saved with is_estimates: true for that same-day figure; Monday's
#     regular run re-scrapes Sunday (now "yesterday") and overwrites it
#     with the confirmed actual (is_estimates: false) — no separate
#     rescrape step needed, it's just the existing Monday run doing its
#     normal job.
#     Note: UTC times don't shift for DST, so during standard time
#     (Nov-Mar) these effectively run an hour earlier in ET. If that
#     becomes an issue, bump the UTC hour by one for standard time.
#
#   WEEKEND CHART — Sundays and Mondays at 5:00 PM ET (22:00 UTC)
#     Sunday  → Estimates are posted mid-afternoon. Saved as is_estimates: true.
#     Monday  → Actuals are confirmed mid-afternoon. Saved as is_estimates: false.
#     NEVER overwrites a file that already has confirmed actuals (is_estimates: false).
#     NEVER overwrites weekend.json with data older than what's already there.
#
# Manual trigger:
#   GitHub → Actions → "Update Box Office Data" → Run workflow
#   Inputs:
#     mode       : daily / weekend / all (default: all)
#     start_date : optional YYYY-MM-DD — scrape that specific day
#                  (in weekend mode, the Friday of the target weekend)
#     end_date   : optional YYYY-MM-DD — inclusive end of a daily range.
#                  Example: start_date=2026-04-17, end_date=2026-04-21
#                  scrapes all five days in one run.

name: Update Box Office Data

on:
  schedule:
    # 4:00 PM ET (20:00 UTC) Mon-Fri — daily chart, weekday timing
    - cron: "0 20 * * 1-5"
    # 3:30 PM ET (19:30 UTC) Saturday — daily chart, scrapes yesterday (Friday) only
    - cron: "30 19 * * 6"
    # 5:30 PM ET (21:30 UTC) Sunday — daily chart, scrapes a Sat-through-Sun RANGE
    # so Sunday's same-day estimate posts same-day (see header comment above)
    - cron: "30 21 * * 0"
    # 5:00 PM ET (22:00 UTC) Sunday + Monday — weekend chart (estimates then actuals)
    - cron: "0 22 * * 0,1"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to update: daily, weekend, or all"
        required: false
        default: "all"
      start_date:
        description: "Backfill start date (YYYY-MM-DD). Leave blank for default (yesterday)."
        required: false
        default: ""
      end_date:
        description: "Backfill end date (YYYY-MM-DD). Leave blank to scrape just start_date."
        required: false
        default: ""

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Determine scraper mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode || 'all' }}" >> $GITHUB_OUTPUT
          elif echo "${{ github.event.schedule }}" | grep -q "0 22"; then
            # 5 PM ET Sun/Mon → weekend chart
            echo "mode=weekend" >> $GITHUB_OUTPUT
          else
            # 4 PM ET Mon-Fri, 3:30 PM ET Sat, or 5:30 PM ET Sun → daily chart
            echo "mode=daily" >> $GITHUB_OUTPUT
          fi

          # Sunday's daily run (5:30 PM ET) needs to catch BOTH Saturday's
          # confirmed actual AND Sunday's same-day estimate in one shot —
          # every other trigger just wants the default "yesterday" scrape.
          if [ "${{ github.event.schedule }}" = "30 21 * * 0" ]; then
            echo "start_date=$(date -u -d 'yesterday' +%Y-%m-%d)" >> $GITHUB_OUTPUT
            echo "end_date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Run scraper (${{ steps.mode.outputs.mode }} mode)
        run: |
          ARGS="--mode ${{ steps.mode.outputs.mode }}"
          START="${{ github.event.inputs.start_date }}"
          END="${{ github.event.inputs.end_date }}"
          START="${START:-${{ steps.mode.outputs.start_date }}}"
          END="${END:-${{ steps.mode.outputs.end_date }}}"
          if [ -n "$START" ]; then
            ARGS="$ARGS --date $START"
          fi
          if [ -n "$END" ]; then
            ARGS="$ARGS --end-date $END"
          fi
          echo "Running: python3 scripts/scrape_the_numbers.py $ARGS"
          python3 scripts/scrape_the_numbers.py $ARGS
        continue-on-error: true

      - name: Run TMDB sync (Mondays only)
        if: |
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'schedule' && github.event.schedule == '0 22 * * 0,1')
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/tmdb_api.py
        continue-on-error: true

      - name: Refresh per-movie weekend history
        # Rebuilds data/movie_weekends/*.json so showdown pages stay current.
        run: python3 scripts/aggregate_movie_weekends.py
        continue-on-error: true

      - name: Rebuild distributor index
        # Aggregates Studio info from every daily/weekend/yearly file into
        # data/distributors.json. The daily page falls back to this when an
        # individual scraped row is missing the Distributor column.
        run: python3 scripts/build_distributor_index.py
        continue-on-error: true

      - name: Rebuild movie totals index
        # Walks every yearly archive and builds data/movie_totals.json so the
        # movie profile page can show the real cumulative domestic gross
        # (including weekday revenue and post-drop-off run) instead of an
        # underestimate from summing weekend grosses.
        run: python3 scripts/build_movie_totals_index.py
        continue-on-error: true

      - name: Rebuild movie articles index
        # Cross-references every article HTML for movie.html links so the
        # movie profile page's "Related Articles" panel populates
        # automatically — every film mentioned in any forecast/roundup/
        # feature appears on its own page.
        run: python3 scripts/build_movie_articles_index.py
        continue-on-error: true

      - name: Rebuild movie charts index
        # Walks every all-time chart and records each row's rank so the
        # movie profile "Charts" panel auto-populates (e.g. Devil Wears
        # Prada → Movies That Never Hit #1 #92, Top Fourth of July #15).
        run: python3 scripts/build_movie_charts_index.py
        continue-on-error: true

      - name: Commit and push updated data files
        run: |
          git config user.name "Box Office Jedi Bot"
          git config user.email "bot@boxofficejedi.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "📊 Auto-update box office data $(date +'%Y-%m-%d') [${{ steps.mode.outputs.mode }}]"
            git pull --rebase origin main
            git push
          else
            echo "No data changes — skipping commit."
          fi
